<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Privacy and support information for SnapSplit.">
  <title>SnapSplit</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f9f8f4; color: #1c2626; line-height: 1.6; }
    a { color: #315f5a; text-underline-offset: 3px; }
    a:focus-visible { outline: 3px solid #e9b932; outline-offset: 3px; }
    .page { width: min(100% - 40px, 680px); margin: 0 auto; padding: 28px 0 72px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: inherit; font-weight: 750; text-decoration: none; }
    .mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: #fce04d; }
    h1 { margin: 76px 0 12px; font-size: clamp(2.25rem, 7vw, 3.6rem); letter-spacing: -.04em; line-height: 1.08; }
    p { margin: 0 0 24px; }
    nav { display: flex; flex-wrap: wrap; gap: 12px 28px; }
    footer { margin-top: 52px; padding-top: 20px; border-top: 1px solid #d9dfda; color: #687775; font-size: .88rem; }
  </style>
</head>
<body>
  <div class="page">
    <header><a class="brand" href="index.html"><span class="mark" aria-hidden="true">✂</span> SnapSplit</a></header>
    <main>
      <h1>SnapSplit</h1>
      <p>Split a video from Photos into short clips and save them to your iPhone.</p>
      <nav aria-label="Information">
        <a href="privacy.html">Privacy Policy</a>
        <a href="support.html">Support</a>
      </nav>
    </main>
    <footer>SnapSplit</footer>
  </div>
</body>
</html>
